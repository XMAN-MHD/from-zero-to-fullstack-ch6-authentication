services:
  blog-backend:
    build:
      context: ./backend
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "3001:3001"

  blog-frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    ports:
      - "3000:80"
    depends_on:
      - blog-backend